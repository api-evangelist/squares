name: Squares
description: Squares is a marketplace platform for discovering and booking curated,
  personally-vetted workspaces around the world — lofts, photo studios, rooftops,
  and villas suited to remote workers, creatives, and digital nomads. Spaces are
  scouted across 13+ cities including Almaty, Da Nang, and Austin, and hosts can list
  their own spaces on the platform. Squares is a portfolio company of 500 Global and
  is tracked in the API Evangelist network. As of this enrichment pass the company
  publishes a consumer marketplace website but no public API, developer portal, or
  developer documentation.
